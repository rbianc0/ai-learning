<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Learning</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }
    main {
      width: min(760px, calc(100% - 40px));
      padding: 56px 0;
    }
    h1 { font-size: clamp(2.4rem, 7vw, 5rem); line-height: 1; margin: 0 0 18px; }
    p { max-width: 62ch; font-size: 1.05rem; opacity: .82; }
    .flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 34px 0 42px;
      font-weight: 700;
    }
    .node {
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      border-radius: 999px;
      padding: 9px 14px;
    }
    .arrow { opacity: .45; }
    section {
      border-top: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      padding-top: 24px;
    }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .09em; opacity: .55; }
    .lesson {
      display: block;
      margin-top: 14px;
      padding: 18px 20px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
    }
    .lesson:hover { border-color: color-mix(in srgb, CanvasText 42%, transparent); }
    .lesson strong { display: block; font-size: 1.08rem; margin-bottom: 4px; }
    .lesson span { opacity: .67; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .92em;
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Learning</h1>
    <p>Keep this page open beside ChatGPT. ChatGPT handles probing, teaching, and quizzes; this site holds the visual and interactive material created during a lesson.</p>

    <div class="flow" aria-label="Learning process">
      <span class="node">Probe</span>
      <span class="arrow">→</span>
      <span class="node">Plan</span>
      <span class="arrow">→</span>
      <span class="node">Teach</span>
      <span class="arrow">→</span>
      <span class="node">Visualize</span>
      <span class="arrow">→</span>
      <span class="node">Check</span>
    </div>

    <section>
      <h2>Lessons</h2>
      <a class="lesson" href="lessons/slicetca-paper.html">
        <strong>Understanding the sliceTCA paper</strong>
        <span>Node 1 · Linear dependence</span>
      </a>
    </section>
  </main>
</body>
</html>
